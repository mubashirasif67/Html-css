<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make a Donation - Blessings Distribution System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h2 class="mb-0">Make a Donation</h2>
                    </div>
                    <div class="card-body">
                        <form id="donationForm" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label for="donorName" class="form-label">Full Name *</label>
                                <input type="text" class="form-control" id="donorName" required>
                            </div>

                            <div class="mb-3">
                                <label for="donorEmail" class="form-label">Email Address</label>
                                <input type="email" class="form-control" id="donorEmail">
                            </div>

                            <div class="mb-3">
                                <label for="donorCnic" class="form-label">CNIC (Optional)</label>
                                <input type="text" class="form-control" id="donorCnic" placeholder="XXXXX-XXXXXXX-X">
                            </div>

                            <div class="mb-3">
                                <label for="donationType" class="form-label">Donation Type *</label>
                                <select class="form-select" id="donationType" required>
                                    <option value="">Select Type</option>
                                    <option value="zakat">Zakat</option>
                                    <option value="sadaqah">Sadaqah</option>
                                    <option value="general">General</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="amount" class="form-label">Amount (PKR) *</label>
                                <input type="number" class="form-control" id="amount" min="1" required>
                            </div>

                            <div class="mb-3">
                                <label for="receiptImage" class="form-label">Receipt Image (Optional)</label>
                                <input type="file" class="form-control" id="receiptImage" accept="image/*">
                                <div class="form-text">Upload a receipt image to automatically detect the amount</div>
                            </div>

                            <div class="mb-3">
                                <div id="imagePreview" class="d-none">
                                    <label class="form-label">Image Preview:</label>
                                    <img id="previewImg" src="" class="img-thumbnail" style="max-width: 200px;">
                                </div>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg">Submit Donation</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/donation.js"></script>
</body>
</html>

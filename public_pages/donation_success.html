<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donation Successful - Blessings Distribution System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow text-center">
                    <div class="card-header bg-success text-white">
                        <h2 class="mb-0">✓ Donation Successful!</h2>
                    </div>
                    <div class="card-body">
                        <div class="mb-4">
                            <svg width="80" height="80" class="text-success mb-3" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
                                <path d="M10.97 4.97a.235.235 0 0 0-.02.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-1.071-1.05z"/>
                            </svg>
                        </div>

                        <h4 class="card-title">Thank you for your generous donation!</h4>
                        <p class="card-text">Your contribution will help us support families in need.</p>

                        <div class="alert alert-info">
                            <h6>Donation Details:</h6>
                            <p class="mb-1"><strong>Donor:</strong> <span id="donorName"></span></p>
                            <p class="mb-1"><strong>Amount:</strong> <span id="donationAmount"></span></p>
                            <p class="mb-1"><strong>Type:</strong> <span id="donationType"></span></p>
                            <p class="mb-0"><strong>Transaction ID:</strong> <span id="transactionId"></span></p>
                        </div>

                        <div class="d-grid gap-2">
                            <a href="donation_form.html" class="btn btn-primary">Make Another Donation</a>
                            <a href="/" class="btn btn-outline-secondary">Back to Home</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Display donation details from URL parameters or session storage
        const urlParams = new URLSearchParams(window.location.search);
        document.getElementById('donorName').textContent = urlParams.get('name') || 'Anonymous Donor';
        document.getElementById('donationAmount').textContent = urlParams.get('amount') || 'N/A';
        document.getElementById('donationType').textContent = urlParams.get('type') || 'N/A';
        document.getElementById('transactionId').textContent = urlParams.get('id') || 'N/A';
    </script>
</body>
</html>

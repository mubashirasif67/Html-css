<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Registration - Blessings Distribution System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-success text-white">
                        <h2 class="mb-0">Employee Registration</h2>
                    </div>
                    <div class="card-body">
                        <form id="employeeForm">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="name" class="form-label">Full Name *</label>
                                    <input type="text" class="form-control" id="name" required>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="fatherName" class="form-label">Father's Name *</label>
                                    <input type="text" class="form-control" id="fatherName" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="cnic" class="form-label">CNIC *</label>
                                <input type="text" class="form-control" id="cnic" placeholder="XXXXX-XXXXXXX-X" required>
                                <div class="form-text">Enter CNIC in format: XXXXX-XXXXXXX-X</div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="grade" class="form-label">Grade *</label>
                                    <select class="form-select" id="grade" required>
                                        <option value="">Select Grade</option>
                                        <option value="1">1</option>
                                        <option value="2">2</option>
                                        <option value="3">3</option>
                                        <option value="4">4</option>
                                        <option value="5">5</option>
                                        <option value="10">10</option>
                                        <option value="15">15</option>
                                        <option value="20">20</option>
                                    </select>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="designation" class="form-label">Designation</label>
                                    <input type="text" class="form-control" id="designation">
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="mobile" class="form-label">Mobile Number *</label>
                                    <input type="tel" class="form-control" id="mobile" placeholder="03XXXXXXXXX" required>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="familySize" class="form-label">Family Size</label>
                                    <input type="number" class="form-control" id="familySize" min="1" value="1">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="address" class="form-label">Address</label>
                                <textarea class="form-control" id="address" rows="3"></textarea>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-success btn-lg">Register Employee</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/employee.js"></script>
</body>
</html>
